name: Build Windows (unsigned)
on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/composer-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
        env:
          DEBUG: electron-packager
      - uses: actions/upload-artifact@v4
        with:
          name: mailspring-windows-unsigned
          path: app/dist/mailspring-win32-x64/
          if-no-files-found: error
          retention-days: 7
